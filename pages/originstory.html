<style>
  /* Container establishes the coordinate space */
  .responsive-container {
    position: relative;
    width: 100%;
    display: inline-block;
  }

  /* Image stretches to fill the container */
  .responsive-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* SVG perfectly overlays the image */
  .responsive-container svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
</style>	
	
</head>
