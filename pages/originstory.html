<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Life</title>
	
	<link href="stylesheet.css" rel="stylesheet" type="text/css">
	
<style>
  .origin-wrapper {
    position: relative;
    width: 100%;
    display: inline-block;
  }

  .origin-wrapper img {
    width: 100%;
    height: auto;
    display: block;
  }

  .origin-wrapper svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  #origin2-anchor {
    position: absolute;
    left: 0;
    width: 100%;
    height: 0;
    /* Adjust this percentage to change where the page scrolls down to */
    top: 50%; 
    scroll-margin-top: 20px;
  }
</style>
</head>

<body>
		
	<div class="origin-wrapper">
		<img src="../images/originstorygif.gif" class="responsive">

		<div id="origin2-anchor"></div>
		
		<svg viewBox="0 0 1024 4000" preserveAspectRatio="none">
			
		 <a href="../index.html">
      		<rect x="14.9%" y="36.3%" width="32%" height="2.7%" fill="yellow" fill-opacity="0.4"/>
    	 </a>
    
    	<!-- Points to our new unique inline anchor -->
    	<a href="#origin2-anchor">
      		<rect x="57.9%" y="35.8%" width="32%" height="3.3%" fill="yellow" fill-opacity="0.4"/>
    	</a>
    
    	<a href="../index.html">
     		<rect x="36.7%" y="92.8%" width="29.9%" height="2.8%" fill="yellow" fill-opacity="0.4"/>
   		</a>
			
	  </svg>

    </div>
	
</body>
</html>
