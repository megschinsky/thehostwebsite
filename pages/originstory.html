<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Life</title>
	
	<link href="stylesheet.css" rel="stylesheet" type="text/css">
	
<style>
  .origin-wrapper {
    position: relative !important;
    width: 100% !important;
    display: inline-block !important;
  }

  .origin-wrapper img {
    width: 100% !important;
    height: auto !important;
    display: block !important;
  }

  /* The !important tags force the SVG back into absolute positioning on top of the image */
  .origin-wrapper svg {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 10 !important; /* Forces the SVG layer to sit on top of the image */
  }

</style>
</head>

<body>

	<div id="origin2-section" style="display: block !important; width: 100% !important; height: 1px !important;">
  		<!-- TUNING TOGGLE: 
       This padding forces the image to push down when the anchor snaps to the top.
       To scroll FURTHER UP (stop sooner), DECREASE this number (e.g., 400px or 300px).
       To scroll FURTHER DOWN, INCREASE this number (e.g., 800px or 1000px). -->
  		<div style="padding-top: 600px !important;"></div>
	</div>
	
	<div class="origin-wrapper">

	  </svg>

    </div>
	
</body>
</html>
