<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Origin Life</title>
	
	<link href="stylesheet.css" rel="stylesheet" type="text/css">
	
<style>
  .origin-wrapper {
    position: relative !important;
    width: 100% !important;
    display: inline-block !important;
	margin-bottom: 1000px !important;
  }

  .origin-wrapper img {
    width: 100% !important;
    height: auto !important;
    display: block !important;
  }

  /* The !important tags force the SVG back into absolute positioning on top of the image */
  .origin-wrapper svg {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 10 !important; /* Forces the SVG layer to sit on top of the image */
  }

</style>
</head>

<body>
		
	<div class="origin-wrapper">
		<img src="../images/originstorygif.gif" class="responsive">
		
		<svg viewBox="0 0 1024 4000" preserveAspectRatio="none">
			
		 <a href="../index.html">
      		<rect x="14.9%" y="36.3%" width="32%" height="2.7%" fill="yellow" fill-opacity="0.4"/>
    	 </a>
    
		<a href="javascript:void(0);" onclick="
      		const img = document.querySelector('.origin-wrapper img');
      		if(img) {
        		const targetScroll = img.getBoundingClientRect().top + window.scrollY + (img.offsetHeight * 0.7);
        		window.scrollTo({ top: targetScroll, behavior: 'smooth' });
      		}
    		">
      		<rect x="57.9%" y="35.8%" width="32%" height="3.3%" fill="yellow" fill-opacity="0.4"/>
    	</a>
    
    	<a href="../index.html">
     		<rect x="36.7%" y="92.8%" width="29.9%" height="2.8%" fill="yellow" fill-opacity="0.4"/>
   		</a>
			
	  </svg>

    </div>
	
</body>
</html>
